<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense & Budget Visualizer</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>💰 Expense Tracker</h1>
            <button id="themeToggle" class="theme-toggle" aria-label="Toggle dark mode">
                <span class="theme-icon">🌙</span>
            </button>
        </header>

        <div class="budget-alert-setting">
            <label for="budgetLimit">Set Budget Limit:</label>
            <input type="number" id="budgetLimit" placeholder="Enter budget limit" min="0">
            <button id="setBudget">Set Limit</button>
        </div>

        <div class="balance-card" id="balanceCard">
            <h2>Total Expenses</h2>
            <p class="balance-amount" id="totalBalance">Rp 0</p>
            <p class="budget-status" id="budgetStatus"></p>
        </div>

        <div class="form-card">
            <h3>Add New Expense</h3>
            <form id="expenseForm">
                <div class="form-group">
                    <label for="itemName">Item Name</label>
                    <input type="text" id="itemName" placeholder="e.g., Lunch" required>
                </div>
                
                <div class="form-group">
                    <label for="amount">Amount (Rp)</label>
                    <input type="number" id="amount" placeholder="e.g., 50000" min="1" required>
                </div>
                
                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" required>
                        <option value="">Select Category</option>
                        <option value="Food">🍔 Food</option>
                        <option value="Transport">🚗 Transport</option>
                        <option value="Fun">🎮 Fun</option>
                    </select>
                </div>
                
                <button type="submit" class="btn-primary">Add Expense</button>
            </form>
        </div>

        <div class="sort-controls">
            <label for="sortBy">Sort by:</label>
            <select id="sortBy">
                <option value="date">Date (Newest First)</option>
                <option value="amount-high">Amount (High to Low)</option>
                <option value="amount-low">Amount (Low to High)</option>
                <option value="category">Category</option>
            </select>
        </div>

        <div class="expense-list-card">
            <h3>Transaction History</h3>
            <div id="expenseList" class="expense-list">
                <p class="empty-state">No expenses yet. Add your first expense above! 📝</p>
            </div>
        </div>

        <div class="chart-card">
            <h3>Expenses by Category</h3>
            <div class="chart-container">
                <canvas id="expenseChart"></canvas>
            </div>
            <div id="chartLegend" class="chart-legend"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="js/script.js"></script>
</body>
                                                   </html>
